<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>{{title}}</title>
        <link rel="icon" type="image/png" href="static/images/favicon.png">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="System information of Raspberry Pi">
        <link href="//fonts.googleapis.com/css?family=Raleway:400,300,600" rel="stylesheet" type="text/css">        
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
        <script src="{{ url_for('static', filename='js/sort.js') }}"></script>
    </head>
    <body>
        <div class="container">
            <div class="row">
                <a href="{{index_url}}">
                    <div class="one column">
                        <img class="logo" src="static/images/rpi_logo_128.png">
                    </div>
                    <div class="eight columns tac">
                        <h3 class="title">{{title}}</h3>
                    </div>
                </a>
                <div class="half column">
                    <div>
                        <a href="reboot" onclick="return confirm('Do you wish to re-start your system ?')">
                            <img src="static/images/reboot.png" style="width:24px; margin-top:5px" alt="Restart">
                        </a>
                    </div>
                    <div>
                        <a href="shutdown" onclick="return confirm('Do you wish to shutdown your system ?')">
                            <img src="static/images/shutdown.png" style="width:24px; margin-top:5px" alt="Shutdown">
                        </a>
                    </div>
                </div>
            </div>

            <div class="tabs">
                <div class="tab-button active" data-tab="tab-generic">Generic</div>
                <div class="tab-button" data-tab="tab-networks">Networks</div>
                <div class="tab-button" data-tab="tab-storage">Storage</div>
                <div class="tab-button" data-tab="tab-processes">Processes</div>
            </div>

            <div id="tab-generic" class="tab-content active">
                <div id="tab-generic-content">
                    <!-- content will be inserted here dynamically -->
                </div>
            </div>

            <div id="tab-networks" class="tab-content">
                <div id="tab-networks-content">
                    <!-- content will be inserted here dynamically -->
                </div>
            </div>

            <div id="tab-storage" class="tab-content">
                <div id="tab-storage-content">
                    <!-- content will be inserted here dynamically -->
                </div>
            </div>

            <div id="tab-processes" class="tab-content">
                <div id="tab-processes-content">
                    <!-- content will be inserted here dynamically -->
                </div>
            </div>

        </div>
    </body>

    <script>
        const tabButtons = document.querySelectorAll('.tab-button');
        const tabContents = document.querySelectorAll('.tab-content');

        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                tabButtons.forEach(btn => btn.classList.remove('active'));
                tabContents.forEach(content => content.classList.remove('active'));
                button.classList.add('active');
                const tabId = button.getAttribute('data-tab');
                document.getElementById(tabId).classList.add('active');

                loadTabContent(tabId);
            });
        });

        function loadTabContent(tabId) {
            const container = document.getElementById(tabId + '-content');
            if (!container) return;

            let timeoutId = setTimeout(() => {
                container.innerHTML = '<div class="loader"></div>';
            }, 300);

            const section = tabId.replace('tab-', '');
            fetch('/partial/' + section)
                .then(response => {
                    if (!response.ok) throw new Error('Network error');
                    return response.text();
                })
                .then(html => {
                    clearTimeout(timeoutId);
                    container.innerHTML = html;
                    attachCollapseHandlers();
                    const tables = container.querySelectorAll('table.sortable');
                    tables.forEach(table => {
                        sorttable.makeSortable(table);
                    });
                })
                .catch(error => {
                    clearTimeout(timeoutId);
                    console.error('Error loading partial:', error);
                    container.innerHTML = '<p class="text-danger">Failed to load data</p>';
                });
        }

        function attachCollapseHandlers() {
            const toggleHeaders = document.querySelectorAll('.toggle-header');
            toggleHeaders.forEach(header => {
                header.removeEventListener('click', toggleCollapse); // чтобы не дублировать
                header.addEventListener('click', toggleCollapse);
            });
        }

        function toggleCollapse(e) {
            this.classList.toggle('collapsed');
            const content = this.nextElementSibling;
            if (content && content.classList.contains('toggle-content')) {
                content.classList.toggle('collapsed');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const activeButton = document.querySelector('.tab-button.active');
            if (activeButton) {
                const tabId = activeButton.getAttribute('data-tab');
                loadTabContent(tabId);
            }
        });
    </script>


</html>
